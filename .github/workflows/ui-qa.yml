name: UI QA Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/ui-qa.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/ui-qa.yml'
  workflow_dispatch:
    inputs:
      runVisual:
        description: 'Run visual regression tests'
        required: false
        default: 'true'
        type: boolean
      runA11y:
        description: 'Run accessibility tests'
        required: false
        default: 'true'
        type: boolean
      runStorybook:
        description: 'Run Storybook visual tests'
        required: false
        default: 'false'
        type: boolean

env:
  PLAYWRIGHT_BASE_URL: http://localhost:3000
  STORYBOOK_URL: http://localhost:6006

jobs:
  setup:
    name: Setup & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            .next
            public
          retention-days: 1

  visual-tests:
    name: Visual Regression Tests
    needs: setup
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.runVisual != 'false' }}
    timeout-minutes: 30
    strategy:
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .

      - name: Install dependencies
        run: npm ci

      - name: Start dev server
        run: |
          npm run dev &
          sleep 30
          curl -f http://localhost:3000 || exit 1

      - name: Run visual tests
        env:
          PLAYWRIGHT_VISUAL: 'true'
        run: npx playwright test --project=${{ matrix.project }} --grep=visual

      - name: Upload visual test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-results-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Upload visual snapshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots-${{ matrix.project }}
          path: tests/visual/__snapshots__/
          retention-days: 7

  accessibility-tests:
    name: Accessibility Tests
    needs: setup
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.runA11y != 'false' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .

      - name: Install dependencies
        run: npm ci

      - name: Start dev server
        run: |
          npm run dev &
          sleep 30
          curl -f http://localhost:3000 || exit 1

      - name: Run accessibility tests
        run: npx playwright test --project=chromium --grep=accessibility

      - name: Upload accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-reports
          path: |
            test-results/accessibility/
            playwright-report/
          retention-days: 7

  storybook-tests:
    name: Storybook Visual Tests
    needs: setup
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.runStorybook == 'true' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run storybook:build || echo "Storybook build script not found, skipping"

      - name: Start Storybook
        run: |
          npm run storybook &
          sleep 30
          curl -f http://localhost:6006 || exit 1

      - name: Run Storybook visual tests
        env:
          PLAYWRIGHT_VISUAL: 'true'
          STORYBOOK_URL: http://localhost:6006
        run: npx playwright test --project=chromium tests/visual/storybook

      - name: Upload Storybook test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  browserstack-tests:
    name: BrowserStack Cross-Browser Tests
    needs: setup
    runs-on: ubuntu-latest
    if: ${{ secrets.BROWSERSTACK_USERNAME && secrets.BROWSERSTACK_ACCESS_KEY }}
    timeout-minutes: 30
    strategy:
      matrix:
        browser: [chrome, firefox, safari, edge]
        os: [Windows 10, Windows 11, macOS Ventura, macOS Sonoma]
        include:
          - browser: chrome
            os: Windows 10
          - browser: firefox
            os: Windows 10
          - browser: safari
            os: macOS Ventura
          - browser: edge
            os: Windows 11
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run BrowserStack tests
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          PLAYWRIGHT_VISUAL: 'true'
        run: |
          npx playwright test --project=${{ matrix.browser }} --grep=visual \
            --config=playwright.browserstack.config.ts

  lambdatest-tests:
    name: LambdaTest Cross-Browser Tests
    needs: setup
    runs-on: ubuntu-latest
    if: ${{ secrets.LAMBDATEST_USERNAME && secrets.LAMBDATEST_ACCESS_KEY }}
    timeout-minutes: 30
    strategy:
      matrix:
        browser: [chrome, firefox, safari, edge]
        os: [Windows 10, Windows 11, macOS Ventura, macOS Sonoma]
        include:
          - browser: chrome
            os: Windows 10
          - browser: firefox
            os: Windows 10
          - browser: safari
            os: macOS Ventura
          - browser: edge
            os: Windows 11
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run LambdaTest tests
        env:
          LT_USERNAME: ${{ secrets.LAMBDATEST_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LAMBDATEST_ACCESS_KEY }}
          PLAYWRIGHT_VISUAL: 'true'
        run: |
          npx playwright test --project=${{ matrix.browser }} --grep=visual \
            --config=playwright.lambdatest.config.ts

  summary:
    name: Test Summary
    needs: [visual-tests, accessibility-tests, storybook-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: all-results
          merge-multiple: true

      - name: Generate summary
        run: |
          echo "# UI QA Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Visual Tests | ${{ needs.visual-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Accessibility Tests | ${{ needs.accessibility-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Storybook Tests | ${{ needs.storybook-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          if [ -f all-results/results.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## Detailed Results" >> $GITHUB_STEP_SUMMARY
            cat all-results/results.json | jq -r '.suites[] | .tests[] | "| \(.title) | \(.outcome) |"' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsPath = 'all-results/results.json';
            if (fs.existsSync(resultsPath)) {
              const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
              const failed = results.suites.flatMap(s => s.tests.filter(t => t.outcome !== 'passed'));
              const passed = results.suites.flatMap(s => s.tests.filter(t => t.outcome === 'passed'));
              
              let comment = `## UI QA Test Results\n\n`;
              comment += `✅ Passed: ${passed.length}\n`;
              comment += `❌ Failed: ${failed.length}\n\n`;
              
              if (failed.length > 0) {
                comment += `### Failures:\n`;
                for (const test of failed.slice(0, 10)) {
                  comment += `- **${test.title}**: ${test.errors[0]?.message || 'Unknown error'}\n`;
                }
              }
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }